<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 궁합 보기 · 사주봄</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="우리 궁합 보기 · 사주봄">
<meta property="og:description" content="보낸 분의 생일이 담긴 궁합 초대예요. 사주봄 앱에서 내 생일만 넣으면 두 사람의 궁합이 나와요.">
<!-- ⚠️ 손으로 고치지 마세요. tools/gen-store-site.mjs가 생성합니다(궁합 초대 다리 — lib/invite.ts compatInviteLink가 이 주소를 보냅니다). -->
<style>
  :root{--bg:#F6F2EE;--card:#FFFFFF;--ink:#23201D;--sub:#524F4C;--line:#E2DAD3;--tint:#9D2A39;--coin:#9E4E52;
    --serif:"Nanum Myeongjo","Batang",serif;--sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#12100F;--card:#1F1C1A;--ink:#F0EBE6;--sub:#BDB6AF;--line:#3A3532;--tint:#EA8C8D}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;word-break:keep-all}
  .wrap{max-width:520px;margin:0 auto;padding:44px 22px 64px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;color:var(--sub);font-size:14px}
  .coin{width:34px;height:34px}
  h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 14px}
  p{font-size:15px;margin:0 0 12px}
  .btn{display:block;text-align:center;background:var(--coin);color:#fff;text-decoration:none;font-weight:700;font-size:16px;
    border-radius:14px;padding:15px 18px;margin:22px 0 14px}
  .sub{color:var(--sub);font-size:14px}
  .note{color:var(--sub);font-size:13px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
  a{color:var(--tint)}
  [hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg class="coin" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#9E4E52"/><circle cx="22" cy="24" r="11" fill="#F3E4CE"/><circle cx="27.5" cy="20.5" r="9.5" fill="#9E4E52"/><circle cx="33" cy="32" r="1.8" fill="#F3E4CE"/><circle cx="16.5" cy="15.5" r="1.1" fill="#F3E4CE"/></svg><span>사주봄</span></div>
  <h1>우리 궁합 보기</h1>
  <p>보낸 분의 생일이 담긴 궁합 초대예요. 사주봄 앱이 열리면 내 생일만 넣으면 두 사람의 궁합이 나와요.</p>
  <a id="open" class="btn" href="https://play.google.com/store/apps/details?id=com.sajubom.app">사주봄 앱에서 열기</a>
  <p id="kakao" class="sub" hidden>앱이 안 열리면 — <a id="ext" href="#">다른 브라우저로 열기</a></p>
  <p id="other" class="sub" hidden>사주봄은 안드로이드 앱이에요. 안드로이드 폰에서 이 링크를 열어 주세요.</p>
  <p class="sub">앱이 없다면 — <a href="https://play.google.com/store/apps/details?id=com.sajubom.app">플레이 스토어에서 사주봄 받기</a></p>
  <p class="note">이 페이지는 생일을 어디로도 보내지 않아요. 주소의 # 뒤에 담긴 값은 이 폰 안에서만 읽혀 앱으로 넘어가요.</p>
</div>
<script>
(function () {
  var keep = /^(py|pm|pd|ph|pmin)=[0-9]{1,4}$|^pg=[MF]$/;
  var h = location.hash.replace(/^#/, '');
  var q = /^[0-9a-z]{7}$/i.test(h) ? 'inv=' + h.toLowerCase()
    : h.split('&').filter(function (kv) { return keep.test(kv); }).join('&');
  var android = /Android/i.test(navigator.userAgent || '');
  var intent = 'intent:///compatibility' + (q ? '?' + q : '') +
    '#Intent;scheme=sajubom;package=com.sajubom.app;S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.sajubom.app') + ';end';
  var btn = document.getElementById('open');
  if (!android) { btn.hidden = true; document.getElementById('other').hidden = false; return; }
  btn.href = intent;
  if (/KAKAOTALK/i.test(navigator.userAgent || '')) {
    document.getElementById('ext').href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    document.getElementById('kakao').hidden = false;
  }
  if (/(^|&)(py|inv)=/.test(q)) setTimeout(function () { location.href = intent; }, 350);
})();
</script>
</body>
</html>
